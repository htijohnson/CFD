<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Checklists - Coburg Fire District</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cabinet+Grotesk:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f1115;
            --bg-card: #161920;
            --bg-card-hover: #1e222b;
            --border-color: rgba(255, 255, 255, 0.06);
            
            --primary: #dc2626; /* Fire Crimson */
            --primary-hover: #b91c1c;
            --primary-glow: rgba(220, 38, 38, 0.25);
            
            --accent: #f59e0b; /* Amber/Gold Alert Tint */
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-display: 'Cabinet Grotesk', 'Inter', sans-serif;
            
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            letter-spacing: -0.01em;
        }

        .ambient-glow {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.08) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Main Workspace Container */
        .dashboard-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        /* Grid Matrix Layout - Centered */
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 350px));
            justify-content: center;
            gap: 1.5rem;
        }

        /* Dashboard Link Cards */
        .portal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.75rem;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-glow) 0%, transparent 50%);
            opacity: 0;
            transition: var(--transition);
        }

        .portal-card:hover {
            transform: translateY(-4px);
            background-color: var(--bg-card-hover);
            border-color: rgba(220, 38, 38, 0.3);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5), 
                        0 0 0 1px rgba(220, 38, 38, 0.1);
        }

        .portal-card:hover::before {
            opacity: 1;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            z-index: 2;
            margin-bottom: 1.5rem;
        }

        .card-icon-frame {
            width: 48px;
            height: 48px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .portal-card:hover .card-icon-frame {
            background-color: rgba(220, 38, 38, 0.15);
            border-color: rgba(220, 38, 38, 0.3);
            color: var(--primary);
        }

        .action-arrow {
            color: var(--text-muted);
            opacity: 0;
            transform: translateX(-8px);
            transition: var(--transition);
        }

        .portal-card:hover .action-arrow {
            opacity: 1;
            transform: translateX(0);
            color: var(--accent);
        }

        .card-info {
            position: relative;
            z-index: 2;
        }

        .card-title {
            font-family: var(--font-sans);
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            letter-spacing: -0.01em;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .footer {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            background-color: #0b0c0f;
        }

        @media (max-width: 768px) {
            .dashboard-container { padding: 2rem 1rem; }
            .link-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <main class="dashboard-container">
        <div class="link-grid">

            <!-- Medical Cabinet -->
            <a href="https://htijohnson.github.io/CFD/checklists/medcabinet.html" class="portal-card">
                <div class="card-top">
                    <div class="card-icon-frame">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
                    </div>
                    <div class="action-arrow">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-title">Medical Cabinet</div>
                    <div class="card-desc">Station medical stock inventory and supply audit checklist.</div>
                </div>
            </a>

            <!-- Medical Gear Checklist -->
            <a href="https://htijohnson.github.io/CFD/checklists/medgear.html" class="portal-card">
                <div class="card-top">
                    <div class="card-icon-frame">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                    </div>
                    <div class="action-arrow">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-title">Medical Gear Checklist</div>
                    <div class="card-desc">Medical Box, O2 Kit, Airway Kit, IV Kit, Peds Bag, Zoll and other apparatus based medical gear</div>
                </div>
            </a>

        </div>
    </main>

    <footer class="footer">
        &copy; 2026 Coburg Fire District. Internal Operations Portal. All Rights Reserved.
    </footer>

</body>
</html>
