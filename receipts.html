<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary-color: #1a73e8;
        --primary-hover: #1557b0;
        --success-color: #1e8e3e;
        --success-hover: #137333;
        --danger-color: #d93025;
        --bg-color: #f8f9fa;
        --card-bg: #ffffff;
        --border-color: #dadce0;
        --text-primary: #202124;
        --text-secondary: #5f6368;
      }

      * { box-sizing: border-box; }

      body { 
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; 
        margin: 0;
        padding: 40px 20px; 
        background-color: var(--bg-color); 
        color: var(--text-primary); 
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .card { 
        width: 100%;
        max-width: 680px; 
        background: var(--card-bg); 
        padding: 36px; 
        border-radius: 12px; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(0,0,0,0.05);
      }

      .account-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background-color: #e8f0fe;
        color: #174ea6;
        padding: 6px 12px;
        border-radius: 16px;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 16px;
        border: 1px solid #d2e3fc;
      }

      .account-badge svg {
        width: 16px;
        height: 16px;
        fill: #174ea6;
      }

      .card-header { margin-bottom: 24px; }

      h2 { 
        font-family: 'Google Sans', sans-serif;
        color: var(--text-primary); 
        margin: 0 0 8px 0; 
        font-size: 24px; 
        font-weight: 700;
        letter-spacing: -0.2px;
      }

      p.description { 
        color: var(--text-secondary); 
        font-size: 14px; 
        line-height: 1.5; 
        margin: 0;
      }

      .upload-zone {
        border: 2px dashed var(--border-color);
        border-radius: 8px;
        padding: 32px 20px;
        text-align: center;
        background-color: #fafafa;
        cursor: pointer;
        transition: all 0.2s ease;
        margin: 24px 0;
        position: relative;
      }

      .upload-zone:hover, .upload-zone.dragover {
        border-color: var(--primary-color);
        background-color: #f1f8fe;
      }

      .upload-zone svg {
        width: 42px;
        height: 42px;
        fill: var(--text-secondary);
        margin-bottom: 12px;
        transition: fill 0.2s ease;
      }

      .upload-zone:hover svg { fill: var(--primary-color); }

      .upload-zone label {
        display: block;
        font-weight: 500;
        font-size: 14px;
        color: var(--text-primary);
        cursor: pointer;
      }

      .upload-zone p {
        margin: 4px 0 0 0;
        font-size: 12px;
        color: var(--text-secondary);
      }

      input[type="file"] { 
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }

      .file-selected-name {
        margin-top: 10px;
        font-size: 13px;
        font-weight: 500;
        color: var(--primary-color);
        word-break: break-all;
      }

      .button-group {
        display: flex;
        gap: 12px;
      }

      button { 
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background-color: var(--primary-color); 
        color: #ffffff; 
        border: none; 
        padding: 12px 20px; 
        border-radius: 6px; 
        cursor: pointer; 
        font-family: 'Google Sans', sans-serif;
        font-size: 14px; 
        font-weight: 500; 
        transition: background-color 0.2s ease, transform 0.1s ease; 
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      }

      button:hover { background-color: var(--primary-hover); }

      button.btn-success { background-color: var(--success-color); }
      button.btn-success:hover { background-color: var(--success-hover); }

      button:disabled { 
        background-color: #e0e0e0; 
        color: #9e9e9e;
        cursor: not-allowed; 
        box-shadow: none;
      }

      #status { 
        margin-top: 20px; 
        padding: 12px 16px;
        border-radius: 6px;
        font-size: 14px; 
        font-weight: 500; 
        display: none;
      }

      #status.info {
        display: block;
        background-color: #e8f0fe;
        color: #174ea6;
        border: 1px solid #d2e3fc;
      }

      #status.success {
        display: block;
        background-color: #e6f4ea;
        color: #137333;
        border: 1px solid #ceead6;
      }

      #status.error {
        display: block;
        background-color: #fce8e6;
        color: #c5221f;
        border: 1px solid #fad2cf;
      }

      #status a { color: inherit; text-decoration: underline; font-weight: bold; }

      #logs { 
        margin-top: 16px; 
        background: #202124; 
        color: #e8eaed;
        padding: 14px; 
        max-height: 240px; 
        overflow-y: auto; 
        font-family: 'Roboto Mono', monospace; 
        font-size: 12px; 
        border-radius: 6px; 
        line-height: 1.6; 
      }

      .log-match { color: #81c995; }
      .log-nomatch { color: #9aa0a6; }
      .log-info { color: #8ab4f8; }
    </style>
  </head>
  <body>

    <div class="card">
      <div class="account-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        <span id="activeEmailDisplay">Active Account: <?= userEmail ?></span>
      </div>

      <div class="card-header">
        <h2>Upload Statement CSV</h2>
        <p class="description">Upload your statement CSV file to search Google Drive for matching receipt amounts and generate a summary PDF report.</p>
      </div>
      
      <div class="upload-zone" id="dropZone">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <label>Choose a CSV file or drag & drop here</label>
        <p>Supports standard statement export files (.csv)</p>
        <input type="file" id="csvFile" accept=".csv" onchange="updateFileName()">
        <div class="file-selected-name" id="fileNameDisplay"></div>
      </div>

      <div class="button-group">
        <button id="uploadBtn" onclick="uploadCsv()">Process CSV Live</button>
        <button id="summaryBtn" class="btn-success" onclick="generateSummaryPdf()">Generate Summary PDF</button>
      </div>

      <div id="status"></div>
      <div id="logs" style="display:none;"></div>
    </div>

    <script>
      const currentAccountEmail = "<?= userEmail ?>";
      let processedTransactions = null;

      function updateFileName() {
        const fileInput = document.getElementById('csvFile');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        if (fileInput.files.length > 0) {
          fileNameDisplay.textContent = `Selected File: ${fileInput.files[0].name}`;
        } else {
          fileNameDisplay.textContent = '';
        }
      }

      function setStatus(message, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.className = type;
        statusDiv.innerHTML = message;
      }

      function setButtonsDisabled(disabled) {
        document.getElementById('uploadBtn').disabled = disabled;
        document.getElementById('summaryBtn').disabled = disabled;
      }

      function appendLog(message, className = "log-info") {
        const logsDiv = document.getElementById('logs');
        logsDiv.style.display = "block";
        const div = document.createElement('div');
        div.className = className;
        div.textContent = message;
        logsDiv.appendChild(div);
        logsDiv.scrollTop = logsDiv.scrollHeight;
      }

      async function processTransactionsWithLiveLogs(csvContent) {
        const logsDiv = document.getElementById('logs');
        logsDiv.innerHTML = "";
        
        appendLog("[INIT] Reading CSV data...", "log-info");

        return new Promise((resolve, reject) => {
          // Step 1: Parse CSV on server
          google.script.run
            .withSuccessHandler(function(transactions) {
              if (!transactions || transactions.length === 0) {
                setStatus("No matching debit transactions found in CSV.", "error");
                reject("No transactions");
                return;
              }

              appendLog(`[INFO] Found ${transactions.length} target transactions. Fetching Drive file list...`, "log-info");
              
              // Step 2: Fetch Google Drive File list
              google.script.run
                .withSuccessHandler(async function(fileList) {
                  appendLog(`[INFO] Indexed ${fileList.length} files from Google Drive. Starting matching process...`, "log-info");

                  let matchedTotal = 0;

                  // Step 3: Iterate transactions and generate live logs instantly
                  for (let i = 0; i < transactions.length; i++) {
                    const tx = transactions[i];
                    setStatus(`Processing transaction ${i + 1} of ${transactions.length} ($${tx.amount})...`, "info");

                    const matches = fileList.filter(f => f.normalizedName.includes(tx.amount));

                    if (matches.length > 0) {
                      matchedTotal += matches.length;
                      matches.forEach(m => {
                        tx.matchedReceipts.push({
                          fileName: m.name,
                          url: m.url
                        });
                        appendLog(`[MATCH] $${tx.amount} (${tx.date}) -> ${m.name}`, "log-match");
                      });
                    } else {
                      appendLog(`[NO MATCH] $${tx.amount} (${tx.date}) - ${tx.description}`, "log-nomatch");
                    }

                    // Yield execution to allow DOM render on each loop step
                    await new Promise(r => setTimeout(r, 40));
                  }

                  processedTransactions = transactions;
                  resolve({ transactions, matchedTotal });
                })
                .withFailureHandler(reject)
                .getDriveFileList();
            })
            .withFailureHandler(reject)
            .parseCsvTransactions(csvContent);
        });
      }

      function uploadCsv() {
        const fileInput = document.getElementById('csvFile');

        if (!fileInput.files.length) {
          alert("Please select a CSV statement file first.");
          return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        setButtonsDisabled(true);
        setStatus(`Starting matching process...`, "info");

        reader.onload = async function(e) {
          try {
            const res = await processTransactionsWithLiveLogs(e.target.result);
            setStatus(`Completed! Found ${res.matchedTotal} matching receipt(s).`, "success");
          } catch (err) {
            setStatus(`Error: ${err.message || err}`, "error");
          } finally {
            setButtonsDisabled(false);
          }
        };

        reader.readAsText(file);
      }

      function generateSummaryPdf() {
        const fileInput = document.getElementById('csvFile');

        if (!fileInput.files.length) {
          alert("Please select a CSV statement file first.");
          return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        setButtonsDisabled(true);
        setStatus(`Generating PDF report...`, "info");

        reader.onload = async function(e) {
          try {
            if (!processedTransactions) {
              const res = await processTransactionsWithLiveLogs(e.target.result);
              processedTransactions = res.transactions;
            }

            setStatus(`Saving PDF report to Google Drive...`, "info");

            google.script.run
              .withSuccessHandler(function(response) {
                setButtonsDisabled(false);
                if (response.success) {
                  setStatus(`Summary Created! <a href="${response.fileUrl}" target="_blank">Open Reconciliation PDF</a> (${response.matchedCount}/${response.totalCount} linked).`, "success");
                } else {
                  setStatus(`Error: ${response.message}`, "error");
                }
              })
              .withFailureHandler(function(err) {
                setButtonsDisabled(false);
                setStatus(`System Error: ${err.message || err}`, "error");
              })
              .saveSummaryPdfReport(processedTransactions);

          } catch (err) {
            setButtonsDisabled(false);
            setStatus(`Error: ${err.message || err}`, "error");
          }
        };

        reader.readAsText(file);
      }

      // Drag and drop setup
      const dropZone = document.getElementById('dropZone');
      ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, (evt) => { evt.preventDefault(); dropZone.classList.add('dragover'); }, false));
      ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, (evt) => { evt.preventDefault(); dropZone.classList.remove('dragover'); }, false));
    </script>
  </body>
</html>
